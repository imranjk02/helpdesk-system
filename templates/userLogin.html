<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
        }

        header {
            background-color: #333;
            color: white;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 20px;
        }

        .login-section {
            min-height: calc(100vh - 80px);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            background-color: white;
            width: 450px;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .login-icon {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background-color: #333;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px;
            font-size: 30px;
            font-weight: bold;
        }

        .login-box h2 {
            text-align: center;
            margin-bottom: 25px;
        }

        .register-link {
            text-align: center;
            margin-top: 20px;
        }

        .register-link a {
            color: #333;
            font-weight: bold;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <header>
        <h1>NetTech Help Desk Ticket Management System</h1>
    </header>
    <div class="login-section">
        <div class="login-box">
            <div class="login-icon">U</div>
            <h2>User Login</h2>

        {% if error %}
            <div class="alert alert-danger">{{ error }}</div>
        {% endif %}

        <form method="POST" action="/userLogin">
            <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text" name="username" class="form-control" placeholder="Enter username" required>
            </div>
 
            <div class="mb-3">
                <label class="form-label"> Password</label>
                <input type="password" name="password" class="form-control" placeholder="Enter password" required>
            </div>

            <div class="text-center">
                <button type="submit" class="btn btn-dark px-4"> Login</button>
            </div>
        </form>

        <div class="register-link"> Don't have an account? <a href="/userRegistration"> Register </a></div>

        <div class="text-center mt-3">
            <a href="/" class="btn btn-secondary btn-sm">Back to Home</a>
        </div>
    </div>
</div>
</body>
</html>
