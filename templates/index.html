<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetTech Help Desk</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
        }

        header {
            background-color: #333;
            color: white;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 20px;
        }

        .home-section {
            min-height: calc(100vh - 80px);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .home-box {
            background-color: white;
            width: 500px;
            padding: 45px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .home-box h2 {
            margin-bottom: 15px;
        }

        .home-box p {
            color: #555;
            margin-bottom: 30px;
            font-size: 17px;
        }

        .home-btn {
            width: 210px;
            margin: 7px;
        }

    </style>
</head>

<body>
    <header>
        <h1>
            NetTech Help Desk Ticket Management System
        </h1>
    </header>

    <div class="home-section">
        <div class="home-box">
            <h2> Welcome </h2>
            <p>Please select an option to continue.</p>
            <a href="/userLogin" class="btn btn-dark home-btn">User</a>
            <a href="/adminLogin" class="btn btn-dark home-btn">Admin</a>
        </div>
    </div>
</body>
</html>
