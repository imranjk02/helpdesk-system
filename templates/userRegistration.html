<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Registration</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
        }

        header {
            background-color: #333;
            color: white;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 20px;
        }

        .registration-section {
            min-height: calc(100vh - 80px);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .registration-box {
            background-color: white;
            width: 500px;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .registration-box h2 {
            text-align: center;
            margin-bottom: 25px;
        }

        .profile-icon {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background-color: #333;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px;
            font-size: 30px;
            font-weight: bold;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
        }

        .login-link a {
            color: #333;
            font-weight: bold;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <header>
        <h1>NetTech Help Desk Ticket Management System</h1>
    </header>

<div class="registration-section">
    <div class="registration-box">
        <div class="profile-icon">U</div>
            <h2>User Registration</h2>

        {% if error %}
            <div class="alert alert-danger">{{ error }}</div>
        {% endif %}

        <form method="POST" action="/userRegistration">
            <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text" name="username" class="form-control" placeholder="Enter username" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" name="email" class="form-control" placeholder="Enter email"required>
            </div>

            <div class="mb-3">
                <label class="form-label"> Password</label>
                <input type="password" name="password" class="form-control" placeholder="Enter password" minlength="5" required>
            </div> 

            <div class="mb-3">
                <label class="form-label">Confirm Password</label>
                <input type="password" name="confirm_password" class="form-control" placeholder="Confirm password" minlength="5" required>
            </div>

            <div class="text-center">
                <button type="submit" class="btn btn-dark px-4">Register</button>
            </div>
        </form>

        <div class="login-link">
            Already have an account?
            <a href="/userLogin">Login</a>
        </div>

        <div class="text-center mt-3">
            <a href="/" class="btn btn-secondary btn-sm">Back to Home</a>
        </div>
    </div>
</div>
</body>
</html>
