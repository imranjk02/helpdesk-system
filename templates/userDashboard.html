<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
        }

        header {
            background-color: #333;
            color: white;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 20px;
        }

        .dashboard-section {
            min-height: calc(100vh - 80px);
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .dashboard-box {
            background-color: white;
            padding: 40px;
            width: 500px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .dashboard-title {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 15px;
        }

        .profile-link {
            text-decoration: none;
        }

        .profile-circle {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background-color: #333;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
            transition: 0.2s;
        }

        .profile-circle:hover {
            background-color: #555;
            transform: scale(1.08);
        }

        .dashboard-box p {
            font-size: 18px;
            color: #555;
        }

    </style>
</head>
<body>

<header>
    <h1>NetTech Help Desk Ticket Management System</h1>
</header>

<div class="dashboard-section">
    <div class="dashboard-box">
        <div class="dashboard-title">
            <h2 class="mb-0"> User Dashboard </h2>
            <a href="/userProfile" class="profile-link" title="View Profile">
                <div class="profile-circle">
                    {{ username[0].upper() }}
                </div>
            </a>
        </div>

        <p>Welcome, {{ username }}!Here you can manage your tickets.</p>

        <form method="POST" action="/submitTicket">
            <div class="mb-3 text-start">
                <label class="form-label">Subject</label>
                <input type="text" name="subject" class="form-control" placeholder="Enter your problem" required>
            </div>

            <div class="mb-3 text-start">
                <label class="form-label">Description</label>
                <textarea name="description" class="form-control" placeholder="Describe your problem" rows="3" required></textarea>
            </div>

            <div class="mb-3 text-start">
                <label class="form-label">Priority</label>
                <select name="priority" class="form-select"required>
                    <option value="">Select Priority</option>
                    <option value="Low">Low </option>
                    <option value="Medium"> Medium</option>
                    <option value="High">High</option>
                </select>
            </div>
            <button type="submit" class="btn btn-dark px-4">Submit Ticket</button>
        </form>
        <br>
        <button class="btn btn-secondary px-4" onclick="window.location.href='/ticketStatus'"> Ticket Status </button>
        <button class="btn btn-dark px-4" onclick="window.location.href='/userLogout'"> Logout </button></div>
</div>
</body>
</html>
