<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
        }

        header {
            background-color: #333;
            color: white;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 20px;
        }

        .profile-section {
            min-height: calc(100vh - 80px);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .profile-box {
            background-color: white;
            width: 500px;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .profile-icon {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background-color: #333;
            color:white;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px;
            font-size: 35px;
            font-weight: bold;
        }

        .profile-title {
            text-align: center;
            margin-bottom: 30px;
        }

        .section-title {
            font-size: 18px;
            font-weight: bold;
            margin-top: 25px;
            margin-bottom: 15px;
            border-bottom: 1px solid #ddd;
            padding-bottom: 8px;
        }

        .password-section {
            background-color: #f8f8f8;
            padding: 20px;
            border-radius: 8px;
        }

    </style>
</head>
<body>
    <header>
        <h1>NetTech Help Desk Ticket Management System</h1>
    </header>

    <div class="profile-section">\
        <div class="profile-box">
            <div class="profile-icon">{{ user['username'][0].upper() }}
        </div>

        <h2 class="profile-title">My Profile</h2>

        {% if error %}
            <div class="alert alert-danger">{{ error }}</div>
        {% endif %}

        {% if success %}
        <div class="alert alert-success">{{ success }}</div>
        {% endif %}

        <div class="section-title">Account Information</div>

        <form method="POST" action="/updateProfile">
            <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text" class="form-control" value="{{ user['username'] }}" disabled>
            </div>

            <div class="mb-3">
                <label class="form-label"> Email</label>
                <input type="email" name="email" class="form-control" value="{{ user['email'] }}" required>
            </div>

            <button type="submit" class="btn btn-dark"> Save Email</button>
        </form>

        <div class="section-title">Change Password</div>
        <div class="password-section">
            <form method="POST" action="/changePassword">
                <div class="mb-3">
                    <label class="form-label">Current Password</label>
                    <input type="password" name="current_password" class="form-control" placeholder="Enter current password" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">New Password</label>
                    <input type="password" name="new_password" class="form-control" placeholder="Enter new password" minlength="5" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Confirm New Password</label>
                    <input type="password" name="confirm_password" class="form-control" placeholder="Confirm new password" minlength="5" required>
                </div>
                
                <button type="submit" class="btn btn-dark">Change Password</button>
            </form>
        </div>
        <br>
        <div class="text-center">
            <a href="/userDashboard" class="btn btn-secondary"> Back to Dashboard </a>
        </div>
    </div>
</div>
</body>
</html>
